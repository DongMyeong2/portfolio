name: Organize BaekjoonHub files

permissions:
  contents: write  # 푸시하려면 필수

on:
  push:
    branches: [ test ]      # ← test에만 자동 실행
  workflow_dispatch:         # 수동 실행도 가능

jobs:
  organize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: test               # 안전하게 test 체크아웃

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Reorganize files
        env:
          TZ: Asia/Seoul
        run: |
          python scripts/organize_baekjoonhub.py

      - name: Commit & push changes (test)
        env:
          BRANCH: test
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: organize by Language/Platform/YYYY-MM-DD/ProblemId_Title"
            git pull --rebase origin "$BRANCH" || true
            git push origin HEAD:"$BRANCH"
          else
            echo "No changes to commit"
          fi
